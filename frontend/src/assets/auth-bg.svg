<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D2A6E"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#17153B"/>
    </linearGradient>
    <radialGradient id="glowV" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="70%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="1600" fill="url(#base)"/>
  <rect width="1200" height="1600" fill="url(#glowV)"/>
  <rect width="1200" height="1600" fill="url(#glowB)"/>
  <rect width="1200" height="1600" fill="url(#glowG)"/>

  <!-- concentric civic rings, top-right -->
  <g stroke="url(#ring)" fill="none" opacity="0.7">
    <circle cx="1050" cy="230" r="120" stroke-width="1.5"/>
    <circle cx="1050" cy="230" r="200" stroke-width="1.2"/>
    <circle cx="1050" cy="230" r="290" stroke-width="1"/>
    <circle cx="1050" cy="230" r="390" stroke-width="0.8"/>
  </g>

  <!-- soft dot grid -->
  <g fill="#FFFFFF" opacity="0.05">
    <!-- generated rows of dots -->
    <g>
      <circle cx="120" cy="1200" r="3"/><circle cx="200" cy="1200" r="3"/><circle cx="280" cy="1200" r="3"/><circle cx="360" cy="1200" r="3"/><circle cx="440" cy="1200" r="3"/>
      <circle cx="120" cy="1280" r="3"/><circle cx="200" cy="1280" r="3"/><circle cx="280" cy="1280" r="3"/><circle cx="360" cy="1280" r="3"/><circle cx="440" cy="1280" r="3"/>
      <circle cx="120" cy="1360" r="3"/><circle cx="200" cy="1360" r="3"/><circle cx="280" cy="1360" r="3"/><circle cx="360" cy="1360" r="3"/><circle cx="440" cy="1360" r="3"/>
      <circle cx="120" cy="1440" r="3"/><circle cx="200" cy="1440" r="3"/><circle cx="280" cy="1440" r="3"/><circle cx="360" cy="1440" r="3"/><circle cx="440" cy="1440" r="3"/>
    </g>
  </g>

  <!-- flowing wave lines (unity / youth movement) -->
  <g stroke="#7C3AED" fill="none" opacity="0.25">
    <path d="M-50 900 C 250 780, 500 1020, 800 880 S 1250 940, 1300 820" stroke-width="1.5"/>
    <path d="M-50 960 C 250 840, 500 1080, 800 940 S 1250 1000, 1300 880" stroke-width="1.2"/>
    <path d="M-50 1020 C 250 900, 500 1140, 800 1000 S 1250 1060, 1300 940" stroke-width="1"/>
  </g>

  <!-- subtle gold accent star cluster -->
  <g fill="#EAB308" opacity="0.6">
    <path d="M300 300 l6 14 15 2 -11 11 3 15 -13 -8 -13 8 3 -15 -11 -11 15 -2 z"/>
  </g>
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="220" cy="420" r="2.5"/><circle cx="380" cy="200" r="2"/><circle cx="480" cy="360" r="2.5"/><circle cx="180" cy="260" r="1.8"/>
  </g>
</svg>
